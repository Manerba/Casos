<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casos</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/markdown_editor.css">
  <link rel="stylesheet" href="/static/css/update_dialog.css">
  <link rel="stylesheet" href="/static/css/issues.css">
  <link rel="stylesheet" href="/static/css/issue_search.css">
  <link rel="stylesheet" href="/static/css/issue_history.css">
  <link rel="stylesheet" href="/static/css/attachment_preview.css">
  <link rel="stylesheet" href="/static/css/settings_overlay.css">
</head>
<body class="main-app">
  <header class="header">
    <h1><a class="header-home" href="/">Casos</a></h1>
    <div class="header-controls">
      <span class="header-username" id="headerUsername"></span>
      <div class="settings-dropdown-wrapper">
        <button type="button" class="settings-btn" id="settingsBtn" aria-label="Einstellungen" data-i18n-aria-label="settingsOverlay.title" aria-controls="settingsDropdown" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/></svg>
        </button>
        <nav class="settings-dropdown" id="settingsDropdown" aria-label="Einstellungen" data-i18n-aria-label="settingsOverlay.title" style="display:none">
          <div class="settings-menu">
            <button type="button" class="settings-item" id="openSettingsBtn">
              <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h4m4 0h8M4 12h8m4 0h4M4 18h2m4 0h10"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>
              <span class="settings-label" data-i18n="settingsOverlay.title">Einstellungen</span>
            </button>
            <button type="button" class="settings-item" id="langToggle" aria-controls="langSubMenu" aria-expanded="false">
              <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
              <span class="settings-label" data-i18n="settings.language">Sprache</span>
              <span class="settings-value" id="langStatus">DE</span>
              <svg class="settings-expand" id="langExpandIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="settings-sub" id="langSubMenu" role="group" aria-labelledby="langToggle" style="display:none"></div>
            <div class="settings-divider" role="separator"></div>
            <button type="button" class="settings-item settings-danger" id="logoutBtn">
              <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m5-12 4 4-4 4m-5-4h9"/></svg>
              <span class="settings-label" data-i18n="auth.logout">Abmelden</span>
            </button>
          </div>
        </nav>
      </div>
    </div>
  </header>
  <div class="filter-bar" id="filterBar" style="display:none"></div>
  <main class="container" id="contentContainer"></main>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app_core.js"></script>
  <script src="/static/js/vendor/marked.umd.js"></script>
  <script src="/static/js/markdown_editor.js"></script>
  <script src="/static/js/update_dialog.js"></script>
  <script src="/static/js/tab_issues.js"></script>
  <script src="/static/js/issue_search.js"></script>
  <script src="/static/js/issue_history.js"></script>
  <script src="/static/js/attachment_preview.js"></script>
  <script src="/static/js/settings_overlay.js"></script>
  <script src="/static/js/tab_allgemein.js"></script>
  <script src="/static/js/tab_benutzer.js"></script>
  <script src="/static/js/tab_ldap.js"></script>
  <script src="/static/js/tab_mail.js"></script>
  <script src="/static/js/tab_tls.js"></script>
  <script src="/static/js/tab_mcp.js"></script>
</body>
</html>
