<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casos</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/markdown_editor.css">
  <link rel="stylesheet" href="/static/css/update_dialog.css">
  <link rel="stylesheet" href="/static/css/issues.css">
  <link rel="stylesheet" href="/static/css/issue_search.css">
  <link rel="stylesheet" href="/static/css/issue_history.css">
  <link rel="stylesheet" href="/static/css/attachment_preview.css">
  <link rel="stylesheet" href="/static/css/settings_overlay.css">
</head>
<body class="main-app">
  <header class="header">
    <h1><a class="header-home" href="/">Casos</a></h1>
    <div class="header-controls">
      <span class="header-username" id="headerUsername"></span>
      <div class="settings-dropdown-wrapper">
        <button type="button" class="settings-btn" id="settingsBtn" aria-label="Einstellungen" data-i18n-aria-label="settingsOverlay.title" aria-haspopup="true" aria-expanded="false">⚙</button>
        <nav class="settings-dropdown" id="settingsDropdown" style="display:none">
          <div class="settings-menu">
            <button type="button" class="settings-item" id="openSettingsBtn" data-i18n="settingsOverlay.title">Einstellungen</button>
            <button type="button" class="settings-item" id="langToggle"><span data-i18n="settings.language">Sprache</span> <span id="langStatus">DE</span> <span id="langExpandIcon">▾</span></button>
            <div class="settings-sub" id="langSubMenu" style="display:none"></div>
            <button type="button" class="settings-item settings-danger" id="logoutBtn" data-i18n="auth.logout">Abmelden</button>
          </div>
        </nav>
      </div>
    </div>
  </header>
  <div class="filter-bar" id="filterBar" style="display:none"></div>
  <main class="container" id="contentContainer"></main>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app_core.js"></script>
  <script src="/static/js/vendor/marked.umd.js"></script>
  <script src="/static/js/markdown_editor.js"></script>
  <script src="/static/js/update_dialog.js"></script>
  <script src="/static/js/tab_issues.js"></script>
  <script src="/static/js/issue_search.js"></script>
  <script src="/static/js/issue_history.js"></script>
  <script src="/static/js/attachment_preview.js"></script>
  <script src="/static/js/settings_overlay.js"></script>
  <script src="/static/js/tab_allgemein.js"></script>
  <script src="/static/js/tab_benutzer.js"></script>
  <script src="/static/js/tab_ldap.js"></script>
  <script src="/static/js/tab_mail.js"></script>
  <script src="/static/js/tab_tls.js"></script>
  <script src="/static/js/tab_mcp.js"></script>
</body>
</html>
