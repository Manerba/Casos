<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/expandable_table.css">
</head>
<body data-admin-mode="true">
    <!-- Header -->
    <header class="header">
        <h1>Tareas <span style="font-size:12px; opacity:0.7; font-weight:normal;">Admin</span></h1>
        <div class="header-controls">
            <span class="header-username" id="headerUsername"></span>
            <div class="settings-dropdown-wrapper">
                <button class="settings-btn" id="settingsBtn">&#x2699;&#xFE0F;</button>
                <nav class="settings-dropdown" id="settingsDropdown" style="display: none;">
                    <div class="settings-menu">
                        <div class="settings-item" id="changePasswordBtn">
                            <span class="settings-icon">&#x1F511;</span>
                            <span class="settings-label">Passwort aendern</span>
                        </div>
                        <div class="settings-item settings-danger" id="logoutBtn">
                            <span class="settings-icon">&#x2192;</span>
                            <span class="settings-label">Abmelden</span>
                        </div>
                        <div class="settings-divider"></div>
                        <div class="settings-item" id="themeToggle">
                            <span class="settings-icon">&#x263E;</span>
                            <span class="settings-label">Dark Mode</span>
                            <span class="settings-value" id="themeStatus">Aus</span>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs main-tabs">
        <a class="tab active" href="#" data-tab="benutzer">Benutzerverwaltung</a>
    </nav>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar" style="display: none;"></div>

    <!-- Content Container -->
    <main class="container" id="contentContainer">
        <div class="table-loading">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="/static/js/expandable_table.js"></script>
    <script src="/static/js/app_core.js"></script>
    <script src="/static/js/tab_benutzer.js"></script>
    <script>
        // Admin-App: User laden und Tab initialisieren
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCurrentUser();
            initBenutzerTab();
        });
    </script>
</body>
</html>
